---
# Let's Encrypt issuers using the HTTP-01 challenge via the nginx ingress class.
# Use the staging issuer while testing (its certs are not browser-trusted but it
# has generous rate limits), then switch Ingresses to letsencrypt-prod.
#
# For internal-only services with no public DNS, use the DNS-01 challenge or a
# self-signed/CA issuer instead.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # TODO: set your email address.
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: set your email address.
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
