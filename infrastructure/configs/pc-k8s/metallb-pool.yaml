---
# Pool of IP addresses MetalLB can hand out to LoadBalancer Services.
# TODO: set a range on your LAN that is OUTSIDE your router's DHCP range.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: primary
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.240-192.168.1.250
---
# Announce those IPs on the local network via ARP/NDP (layer 2 mode).
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: primary
  namespace: metallb-system
spec:
  ipAddressPools:
    - primary
