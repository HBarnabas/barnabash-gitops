---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      # TODO: check https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
      version: "4.12.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      # Expose the controller via a LoadBalancer Service. On k3s this is served
      # by the built-in servicelb; on bare-metal k8s it is served by MetalLB.
      kind: Deployment
      service:
        type: LoadBalancer
        externalTrafficPolicy: Local
      ingressClassResource:
        name: nginx
        default: true
      # Needed for large uploads (e.g. Immich photos/videos).
      config:
        proxy-body-size: "0"
        use-forwarded-headers: "true"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
