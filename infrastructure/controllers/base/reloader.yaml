---
# Stakater Reloader: automatically restarts Deployments/StatefulSets when the
# ConfigMaps or Secrets they reference change. Handy for GitOps-managed config.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      # TODO: check https://artifacthub.io/packages/helm/stakater/reloader
      version: "1.4.0"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  values:
    reloader:
      reloadOnCreate: true
      readOnlyRootFileSystem: true
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
