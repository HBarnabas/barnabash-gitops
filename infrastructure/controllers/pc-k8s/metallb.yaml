---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      # TODO: check https://artifacthub.io/packages/helm/metallb/metallb
      version: "0.14.9"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    createNamespace: true
  values: {}
  # The actual IP pool (IPAddressPool + L2Advertisement) lives in
  # infrastructure/configs/pc-k8s so it can depend on the CRDs installed here.
