---
# App reconciliation definitions. Each workload is reconciled independently.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/pc-k3s
  # Temporarily keep false while resources transfer to child Kustomizations.
  # Re-enable after verifying with `flux tree` that workloads moved to them.
  prune: false
  wait: false
