---
# Infrastructure controllers: cert-manager, ingress-nginx, reloader, metallb, ...
# These are the low-level pieces everything else depends on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/rpi5-k3s
  prune: true
  wait: true
---
# Cluster-scoped configuration (ClusterIssuers, MetalLB pools, ...).
# Depends on the controllers being installed and healthy first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs/rpi5-k3s
  prune: true
