---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-pi-hole
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
    - name: apps-sources
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/pi-hole
  prune: true
  wait: true
