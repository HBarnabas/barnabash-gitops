apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale
  namespace: headscale
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-traefik
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vpn.barnabash.com
      secretName: headscale-tls
  rules:
    - host: vpn.barnabash.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 8080
