#     --project=<PROJECT_ID> --display-name="DDNS updater"
#   gcloud projects add-iam-policy-binding <PROJECT_ID> \
#     --member="serviceAccount:ddns-updater@<PROJECT_ID>.iam.gserviceaccount.com" \
#     --role="roles/dns.admin"
#   gcloud iam service-accounts keys create key.json \
#     --iam-account=ddns-updater@<PROJECT_ID>.iam.gserviceaccount.com
