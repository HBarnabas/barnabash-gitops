---
# !!! ENCRYPT THIS FILE BEFORE COMMITTING !!!
#   sops --encrypt --in-place apps/base/immich/secret.sops.yaml
# After encryption only the values under `stringData` are ciphertext; the rest
# stays readable so diffs remain useful. See the top-level README for SOPS setup.
apiVersion: v1
kind: Secret
metadata:
  name: immich-db
  namespace: immich
type: Opaque
stringData:
  # Must match the password of the `immich` Postgres role you create.
  password: CHANGE_ME
