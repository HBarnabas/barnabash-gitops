---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 1h
  # OCIRepository charts are referenced via chartRef (not chart.spec, which only
  # accepts HelmRepository/GitRepository/Bucket sources). The chart version/tag
  # is pinned on the OCIRepository itself.
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system
  values:
    # Shared config for the Immich components.
    controllers:
      main:
        containers:
          main:
            env:
              # --- Database (points at the StatefulSet in this namespace) ---
              DB_HOSTNAME: immich-postgres
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db
                    key: password
              # Enable machine learning together with machine-learning.enabled
              # below to get smart search and face recognition.
              IMMICH_MACHINE_LEARNING_ENABLED: "false"

    immich:
      persistence:
        library:
          existingClaim: immich-library

    # Bundled Redis-compatible cache (job queues). Lightweight.
    valkey:
      enabled: true

    server:
      enabled: true
      # NodePort gives a stable <node-ip>:30283 endpoint that survives pod
      # restarts (the Service routes to whatever replica is Ready), unlike
      # `kubectl port-forward` which is pinned to one pod.
      service:
        main:
          type: NodePort
          ports:
            http:
              port: 2283
              nodePort: 30283
      # Reachable by hostname via Traefik (k3s built-in) over LAN/VPN, plus the
      # NodePort fallback above.
      ingress:
        main:
          enabled: true
          className: traefik
          annotations: {}
          hosts:
            - host: immich.home.barnabash.com
              paths:
                - path: "/"
                  service:
                    identifier: main

    # Off for now. Enable later once the basics work.
    machine-learning:
      enabled: false
