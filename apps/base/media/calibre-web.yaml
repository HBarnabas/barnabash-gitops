# Calibre-Web provides the manual ebook library UI and OPDS access. Keep it
# private to LAN/Headscale; its initial admin credentials are set in the UI.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/calibre-web
              tag: version-0.6.27
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: Europe/Budapest
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: main
        type: NodePort
        ports:
          http:
            port: 8083
            nodePort: 30883
    ingress:
      main:
        className: traefik
        hosts:
          - host: calibre.home.barnabash.com
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
    persistence:
      config:
        existingClaim: calibre-web-config
        globalMounts:
          - path: /config
      library:
        existingClaim: calibre-library
        globalMounts:
          - path: /books
