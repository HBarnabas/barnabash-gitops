# ---------------------------------------------------------------------------
# Shared data volume on the 2TB HDD. ONE hostPath (/mnt/hdd/data) holding both
# torrents/ and media/, mounted at /data into qBittorrent + Sonarr + Radarr so
# hardlinks and instant atomic moves work (same filesystem).
# hostPath capacity is informational; it shares the HDD's free space. Retain =
# data survives PV/PVC recreation. RWO is fine: all pods run on the single node.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data
spec:
  capacity:
    storage: 1500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hdd
  hostPath:
    path: /mnt/hdd/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hdd
  volumeName: media-data
  resources:
    requests:
      storage: 1500Gi
---
# Jellyfin gets a narrower view: only the media/ subtree (read side), mounted at
# /media. It never sees torrents/. Points at /mnt/hdd/data/media on the host.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
spec:
  capacity:
    storage: 1500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hdd
  hostPath:
    path: /mnt/hdd/data/media
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hdd
  volumeName: jellyfin-media
  resources:
    requests:
      storage: 1500Gi
---
# Calibre-Web's library lives on the HDD with the rest of the media data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: calibre-library-data
spec:
  capacity:
    storage: 1000Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hdd
  hostPath:
    path: /mnt/hdd/data/media/books
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-library
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hdd
  volumeName: calibre-library-data
  resources:
    requests:
      storage: 1000Gi
