---
# Jellyfin config/metadata stays on the SSD (fast local-path) -- it's small and
# benefits from fast random IO.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
# The media library lives on the 2TB HDD (/mnt/hdd/media) via the shared `hdd`
# StorageClass -- this is where the existing media data on the drive goes.
# hostPath size is informational only; it shares the HDD's free space.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-library
spec:
  capacity:
    storage: 1000Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hdd
  hostPath:
    path: /mnt/hdd/media
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hdd
  volumeName: media-library
  resources:
    requests:
      storage: 1000Gi
