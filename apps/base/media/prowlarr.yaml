---
# Prowlarr — indexer manager. Feeds indexers to Sonarr/Radarr. No media access
# needed (only config). Private, VPN-only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.1.5
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      main:
        controller: main
        type: NodePort
        ports:
          http:
            port: 9696
            nodePort: 30696
    persistence:
      config:
        existingClaim: prowlarr-config
        globalMounts:
          - path: /config
