---
# Prowlarr — indexer manager. Feeds indexers to Sonarr/Radarr. No media access
# needed (only config). Private, VPN-only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: version-2.7.0.5723
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: Europe/Budapest
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      main:
        controller: main
        type: NodePort
        ports:
          http:
            port: 9696
            nodePort: 30696
    ingress:
      main:
        className: traefik
        hosts:
          - host: prowlarr.home.barnabash.com
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
    persistence:
      config:
        existingClaim: prowlarr-config
        globalMounts:
          - path: /config
