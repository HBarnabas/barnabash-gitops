---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: jellyfin
      # TODO: check https://artifacthub.io/packages/helm/jellyfin/jellyfin
      version: "2.3.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
  values:
    # Config/metadata on fast local storage; the media library is a shared,
    # read-mostly PVC that the download client also writes into.
    persistence:
      config:
        enabled: true
        existingClaim: jellyfin-config
      media:
        enabled: true
        existingClaim: media-library
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
      hosts:
        - host: jellyfin.example.com # TODO: your domain
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: jellyfin-tls
          hosts:
            - jellyfin.example.com # TODO: your domain
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    # Hardware transcoding: mount /dev/dri and add the render group. Requires a
    # GPU/VAAPI-capable node — enable in the pc-k8s overlay, not on the Pi.
