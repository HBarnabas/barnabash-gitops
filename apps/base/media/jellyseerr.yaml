---
# Jellyseerr — request manager (Overseerr fork with Jellyfin support). Users
# browse and request titles; it hands them to Sonarr/Radarr and reads the
# Jellyfin library for availability. Config/db only, no media access needed.
# Private, VPN-only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/fallenbagel/jellyseerr
              tag: 2.7.3
            env:
              TZ: Europe/Budapest
              LOG_LEVEL: info
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
    service:
      main:
        controller: main
        type: NodePort
        ports:
          http:
            port: 5055
            nodePort: 30055
    persistence:
      config:
        existingClaim: jellyseerr-config
        globalMounts:
          - path: /app/config
