---
# Byparr — Cloudflare-challenge solver (FlareSolverr-compatible drop-in).
# Prowlarr calls it in-cluster to fetch pages from indexers behind Cloudflare.
# Stateless (a Firefox/camoufox stealth browser driven by Playwright), no
# persistent config. Private, ClusterIP only.
#
# Single uvicorn worker + single browser. A solve is CPU-heavy (can peg all
# cores) so we cap CPU to keep the node responsive, and give it a real /dev/shm
# (k8s defaults to 64Mi, which makes camoufox thrash). BLOCK_MEDIA skips
# images/css/fonts for a big speed/RAM win.
#
# Upstream only publishes rolling tags (latest/main/nightly), no semver.
# Current 'latest' multi-arch digest (2026-09-10):
#   sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: byparr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/thephaseless/byparr
              tag: latest
            env:
              LOG_LEVEL: INFO
              # Don't fetch images/css/fonts while solving — much lower CPU/RAM.
              BLOCK_MEDIA: "true"
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                # Cap CPU so a solve can't peg every core and freeze the node
                # (Pi 5 has 4 cores; leave one for k3s/system/SSH).
                cpu: "3"
                # A single Firefox/camoufox instance plus /dev/shm.
                memory: 2Gi
    persistence:
      # Proper shared memory for the browser (k8s default /dev/shm is 64Mi).
      # medium: Memory means this counts against the container memory limit.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /dev/shm
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8191
