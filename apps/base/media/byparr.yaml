---
# Byparr — Cloudflare-challenge solver (FlareSolverr-compatible drop-in).
# Prowlarr calls it in-cluster to fetch pages from indexers behind Cloudflare.
# Stateless (headless browser), no persistent config. Private, ClusterIP only.
#
# Upstream only publishes rolling tags (latest/main/nightly), no semver.
# Current 'latest' multi-arch digest (2026-09-10):
#   sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: byparr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/thephaseless/byparr
              tag: latest
            env:
              LOG_LEVEL: INFO
              # Recycle the browser periodically to keep memory in check.
              BROWSER_LIMIT: "5"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Headless Chromium is memory-hungry.
                memory: 1536Mi
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8191
