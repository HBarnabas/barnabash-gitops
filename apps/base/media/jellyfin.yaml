---
# Jellyfin — media server (private, VPN-only). Reads the media/ subtree only
# (mounted read side at /media -> /media/movies, /media/tv). Reach it over the
# WireGuard tunnel at http://<pi-ip>:30096.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
  values:
    # Same UID/GID family as the *arr apps so it can read the library files.
    podSecurityContext:
      fsGroup: 1000
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000

    service:
      type: NodePort
      port: 8096
      nodePort: 30096

    # Reachable by hostname via Traefik (k3s built-in) over LAN/VPN, and still
    # on the NodePort as a fallback.
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: jellyfin.home.barnabash.com
          paths:
            - path: /
              pathType: Prefix

    persistence:
      config:
        enabled: true
        existingClaim: jellyfin-config
      media:
        enabled: true
        type: pvc
        existingClaim: jellyfin-media

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # Hardware transcoding (VAAPI/QSV) needs /dev/dri + render group -- only on a
    # GPU-capable node. Leave off on the Pi; enable via a pc-k8s overlay later.
