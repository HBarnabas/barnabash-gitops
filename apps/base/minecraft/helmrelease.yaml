---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: minecraft
spec:
  interval: 1h
  chart:
    spec:
      chart: minecraft
      # TODO: check https://artifacthub.io/packages/helm/minecraft-server-charts/minecraft
      version: "5.2.0"
      sourceRef:
        kind: HelmRepository
        name: itzg
        namespace: flux-system
  values:
    minecraftServer:
      eula: "TRUE"
      type: PAPER # PAPER = good performance + plugins; use VANILLA/FABRIC/FORGE as needed
      version: "26.3"
      difficulty: normal
      # Expose so friends can connect. LoadBalancer gets a dedicated IP
      # (k3s servicelb / MetalLB). Switch to NodePort if you prefer.
      serviceType: LoadBalancer
      # RCON password comes from a SOPS-encrypted secret (see secret.sops.yaml).
      rcon:
        enabled: true
        existingSecret: minecraft-rcon
      # Ops / whitelist — put your and friends' usernames/UUIDs here.
      ops: ""
      whitelist: "LightsOut_101,HerrLinks,Joko11222,Barnovskij"
      pluginUrls:
        - "https://cdn.modrinth.com/data/iyXdvueB/versions/rlR4hXpl/customtime-1.0.1.jar" # set day/night to 45/20mins in /data/plugins/CustomTime/config.yml
        - "https://cdn.modrinth.com/data/lO4tsixF/versions/2EkFsXm1/DeathChest-1.1.1.jar"
        - "https://cdn.modrinth.com/data/UpDZRvru/versions/9Kn5c13O/TabLocation-2.0.jar"
        - "https://hangarcdn.papermc.io/plugins/ayberkconff/SleepVote/versions/1.0/PAPER/SleepVote-1.0-SNAPSHOT.jar"
      overrideServerProperties: true
      memory: 2G # bump on pc-k8s via overlay patch
    resources:
      requests:
        cpu: 500m
        memory: 2560Mi
    persistence:
      dataDir:
        enabled: true
        existingClaim: minecraft-data
