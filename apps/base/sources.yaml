---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: immich
  namespace: flux-system
spec:
  # Newer Immich charts (>= 0.13.x, app v3.x) are published only as OCI
  # artifacts, not to the classic HTTP index. An OCIRepository points at the
  # full chart path (incl. chart name) and a specific tag; the HelmRelease
  # consumes it via chartRef.
  interval: 24h
  url: oci://ghcr.io/immich-app/immich-charts/immich
  ref:
    tag: "0.13.1"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  interval: 24h
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: itzg
  namespace: flux-system
spec:
  interval: 24h
  url: https://itzg.github.io/minecraft-server-charts
---
# bjw-s app-template: a flexible generic chart used here for qBittorrent.
# It's the de-facto standard for self-hosted apps that lack a good official chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: flux-system
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
